<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin.xhtml">
    <ui:define name="metadata">
        <f:metadata>
        <f:viewParam name="id" value="#{propiedadFormularioBean.id}" />
        <f:viewAction action="#{propiedadFormularioBean.preparar}" onPostback="false" />
        </f:metadata>
    </ui:define>
    <ui:define name="title">#{propiedadFormularioBean.edicion ? 'Editar propiedad' : 'Registrar propiedad'}</ui:define>
    <ui:define name="subtitle">Completa la información del inmueble. Los campos con * son obligatorios.</ui:define>
    <ui:define name="content">
        <div class="admin-actions d-flex flex-wrap">
            <h:link styleClass="btn btn-outline-secondary admin-btn admin-btn-secondary" outcome="/admin/propiedades-jsf" value="Volver al listado" />
        </div>
                <h:messages id="mensajes" globalOnly="true" layout="list" showSummary="true" showDetail="false"
                            styleClass="admin-jsf-messages" errorClass="alert alert-danger admin-error" infoClass="alert alert-success" />
                <h:form id="propiedad" rendered="#{propiedadFormularioBean.habilitado}" styleClass="admin-panel">
                    <div class="admin-stack">
                        <h:panelGroup layout="block" rendered="#{propiedadFormularioBean.edicion}" styleClass="admin-muted">
                            Identificador: <h:outputText id="identificador" value="#{propiedadFormularioBean.propiedad.id}" />
                        </h:panelGroup>
                        <div class="row g-3">
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="titulo" value="Título *" styleClass="form-label"  />
                                <h:inputText id="titulo" value="#{propiedadFormularioBean.propiedad.titulo}" required="true" requiredMessage="El título es obligatorio." styleClass="form-control"  />
                                <h:message for="titulo" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="precio" value="Precio ($) *" styleClass="form-label"  />
                                <h:inputText id="precio" value="#{propiedadFormularioBean.propiedad.precio}" converter="jakarta.faces.BigDecimal" required="true"
                                             requiredMessage="El precio es obligatorio." converterMessage="El precio debe ser un número válido con punto decimal." styleClass="form-control"  />
                                <h:message for="precio" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="ubicacion" value="Ubicación *" styleClass="form-label"  />
                                <h:inputText id="ubicacion" value="#{propiedadFormularioBean.propiedad.ubicacion}" required="true" requiredMessage="La ubicación es obligatoria." styleClass="form-control"  />
                                <h:message for="ubicacion" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="direccion" value="Dirección" styleClass="form-label"  />
                                <h:inputText id="direccion" value="#{propiedadFormularioBean.propiedad.direccion}" styleClass="form-control"  />
                                <h:message for="direccion" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="tipo" value="Tipo de inmueble *" styleClass="form-label"  />
                                <h:selectOneMenu id="tipo" value="#{propiedadFormularioBean.propiedad.tipo}" required="true" requiredMessage="El tipo es obligatorio." styleClass="form-select" >
                                    <f:selectItem itemValue="" itemLabel="Selecciona un tipo" noSelectionOption="true" />
                                    <f:selectItems value="#{propiedadFormularioBean.tipos}" />
                                </h:selectOneMenu>
                                <h:message for="tipo" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="operacion" value="Operación *" styleClass="form-label"  />
                                <h:selectOneMenu id="operacion" value="#{propiedadFormularioBean.propiedad.tipoOperacion}" required="true" requiredMessage="La operación es obligatoria." styleClass="form-select" >
                                    <f:selectItems value="#{propiedadFormularioBean.operaciones}" />
                                </h:selectOneMenu>
                                <h:message for="operacion" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="estado" value="Estado *" styleClass="form-label"  />
                                <h:selectOneMenu id="estado" value="#{propiedadFormularioBean.propiedad.estado}" required="true" requiredMessage="El estado es obligatorio." styleClass="form-select" >
                                    <f:selectItems value="#{propiedadFormularioBean.estados}" />
                                </h:selectOneMenu>
                                <h:message for="estado" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="area" value="Área (m²) *" styleClass="form-label"  />
                                <h:inputText id="area" value="#{propiedadFormularioBean.propiedad.area}" required="true" requiredMessage="El área es obligatoria."
                                             converterMessage="El área debe ser un número válido con punto decimal." styleClass="form-control"  />
                                <h:message for="area" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="habitaciones" value="Habitaciones" styleClass="form-label"  />
                                <h:inputText id="habitaciones" value="#{propiedadFormularioBean.propiedad.habitaciones}" converterMessage="Las habitaciones deben ser un número entero válido." styleClass="form-control"  />
                                <h:message for="habitaciones" styleClass="admin-error" />
                            </div>
                            <div class="col-12 col-md-6 admin-field">
                                <h:outputLabel for="banos" value="Baños" styleClass="form-label"  />
                                <h:inputText id="banos" value="#{propiedadFormularioBean.propiedad.banos}" converterMessage="Los baños deben ser un número entero válido." styleClass="form-control"  />
                                <h:message for="banos" styleClass="admin-error" />
                            </div>
                            <div class="col-12 admin-field">
                                <h:outputLabel for="imagen" value="Ruta de la imagen principal" styleClass="form-label"  />
                                <h:inputText id="imagen" value="#{propiedadFormularioBean.propiedad.imagenPrincipal}" styleClass="form-control"  />
                                <div class="admin-note">Déjala vacía para utilizar la imagen predeterminada del inmueble.</div>
                                <h:message for="imagen" styleClass="admin-error" />
                            </div>
                            <div class="col-12 admin-field">
                                <h:outputLabel for="descripcion" value="Descripción" styleClass="form-label"  />
                                <h:inputTextarea id="descripcion" value="#{propiedadFormularioBean.propiedad.descripcion}" rows="4" styleClass="form-control"  />
                                <h:message for="descripcion" styleClass="admin-error" />
                            </div>
                            <div class="col-12"><div class="admin-check">
                                <h:selectBooleanCheckbox id="destacada" value="#{propiedadFormularioBean.propiedad.destacada}" styleClass="form-check-input"  />
                                <h:outputLabel for="destacada" value="Mostrar como destacada" styleClass="form-check-label" />
                            </div></div>
                        </div>
                        <div class="admin-form-actions d-flex flex-wrap">
                            <h:commandButton id="guardar" value="#{propiedadFormularioBean.edicion ? 'Actualizar propiedad' : 'Registrar propiedad'}" action="#{propiedadFormularioBean.guardar}" styleClass="btn btn-primary admin-btn admin-btn-primary" />
                            <h:link outcome="/admin/propiedades-jsf" value="Cancelar" styleClass="btn btn-outline-secondary admin-btn admin-btn-secondary" />
                        </div>
                    </div>
                </h:form>
    </ui:define>
</ui:composition>
