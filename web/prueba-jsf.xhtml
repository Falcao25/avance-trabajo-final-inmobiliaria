<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core" lang="es">
    <h:head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>APF2 | Prueba JSF y CDI</title>
        <link rel="stylesheet" href="#{request.contextPath}/css/styles.css" />
        <link rel="stylesheet" href="#{request.contextPath}/css/layout.css" />
    </h:head>
    <h:body>
        <main class="container">
            <h1>Preparación del APF2</h1>
            <p><h:outputText id="tecnologia" value="#{pruebaJsfBean.tecnologia}" /></p>
            <p><h:outputText id="saludo" value="#{pruebaJsfBean.saludo}" /></p>
            <h:form id="prueba">
                <h:messages />
                <div class="form-field">
                    <h:outputLabel for="nombre" value="Nombre" />
                    <h:inputText id="nombre" value="#{pruebaJsfBean.nombre}" required="true"
                                 requiredMessage="Ingresa un nombre.">
                        <f:validateLength minimum="1" maximum="80" />
                    </h:inputText>
                </div>
                <h:commandButton id="saludar" value="Probar comunicación" action="#{pruebaJsfBean.saludar}"
                                 styleClass="btn btn-primary" />
            </h:form>
            <p><a href="#{request.contextPath}/index.jsp">Volver al inicio</a></p>
            <p><a href="#{request.contextPath}/propiedades">Abrir catálogo de propiedades</a></p>
        </main>
    </h:body>
</html>
